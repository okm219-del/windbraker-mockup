<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바람막이 로고 목업 스튜디오</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --card-bg: rgba(51, 65, 85, 0.4);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 16px 28px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 36px; height: 36px; background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .brand h1 { font-size: 1.15rem; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .brand span { font-size: 0.8rem; color: var(--text-muted); }

    .app-body { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 360px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-input-wrapper {
      position: relative;
      border: 2px dashed rgba(59, 130, 246, 0.4);
      border-radius: 10px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      background: rgba(59, 130, 246, 0.05);
      transition: all 0.25s ease;
    }
    .file-input-wrapper:hover {
      background: rgba(59, 130, 246, 0.12);
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .file-input-wrapper input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .btn {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #e2e8f0;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 12px;
    }
    .control-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      accent-color: var(--primary);
      cursor: pointer;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      transition: border 0.2s;
    }
    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      background: #181a20;
    }

    canvas { display: block; cursor: crosshair; }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-paste {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-shirt"></i></div>
      <div>
        <h1>바람막이 로고 목업 스튜디오</h1>
        <span>도안 위에 로고를 자유롭게 올리고 조절해보세요</span>
      </div>
    </div>
    <button class="btn btn-primary" onclick="downloadImage()">
      <i class="fa-solid fa-download"></i> 결과물 저장 (PNG)
    </button>
  </header>

  <div class="app-body">
    <div class="sidebar">

      <div class="card">
        <div class="section-title"><i class="fa-solid fa-upload"></i> 1. 로고 이미지 업로드</div>
        <div class="file-input-wrapper">
          <i class="fa-solid fa-cloud-arrow-up" style="font-size: 1.5rem; color: var(--primary); margin-bottom: 6px;"></i>
          <div style="font-size:0.85rem; font-weight: 600;">파일 선택 또는 드래그</div>
          <div style="font-size:0.75rem; color: var(--text-muted); margin-top: 4px;">
            <span class="badge-paste">Ctrl + V</span> 복사된 이미지 붙여넣기 지원
          </div>
          <input type="file" id="logoInput" accept="image/*" onchange="handleLogoUpload(event)">
        </div>
      </div>

      <div class="card">
        <div class="section-title"><i class="fa-solid fa-location-crosshairs"></i> 2. 로고 위치 퀵 프리셋</div>
        <div class="preset-grid">
          <button class="btn" onclick="setPreset('front-left')"><i class="fa-solid fa-arrow-left"></i> 전면 좌측</button>
          <button class="btn" onclick="setPreset('front-right')">전면 우측 <i class="fa-solid fa-arrow-right"></i></button>
          <button class="btn" onclick="setPreset('back-center')"><i class="fa-solid fa-align-center"></i> 후면 중앙</button>
          <button class="btn" onclick="setPreset('back-sleeve')"><i class="fa-solid fa-hand"></i> 후면 소매</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title"><i class="fa-solid fa-sliders"></i> 3. 로고 상세 변형</div>
        <div class="control-group">
          <label>크기 조절 <span id="valScale">100%</span></label>
          <input type="range" id="scaleInput" min="10" max="300" value="100" oninput="updateLogo()">
        </div>
        <div class="control-group">
          <label>회전 <span id="valRotate">0°</span></label>
          <input type="range" id="rotateInput" min="-180" max="180" value="0" oninput="updateLogo()">
        </div>
        <div class="control-group">
          <label>투명도 <span id="valOpacity">100%</span></label>
          <input type="range" id="opacityInput" min="10" max="100" value="100" oninput="updateLogo()">
        </div>
        <div class="control-group">
          <label>원단 블렌드 모드</label>
          <select id="blendInput" onchange="updateLogo()">
            <option value="source-over">일반 (Normal)</option>
            <option value="multiply" selected>곱하기 (Multiply - 질감 살림)</option>
            <option value="overlay">오버레이 (Overlay)</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="section-title"><i class="fa-solid fa-font"></i> 4. 텍스트 추가 (선택사항)</div>
        <div class="control-group">
          <input type="text" id="textInput" placeholder="후면 텍스트 문구 입력..." oninput="draw()">
        </div>
        <div class="control-group">
          <label>글자 색상</label>
          <input type="color" id="textColor" value="#ffffff" onchange="draw()" style="width:100%; height:36px; border:none; border-radius:6px; cursor:pointer;">
        </div>
      </div>

    </div>

    <div class="main-area">
      <div class="canvas-container">
        <canvas id="mockupCanvas" width="1024" height="512"></canvas>
      </div>
      <div class="hint">
        <i class="fa-solid fa-circle-info"></i> 캔버스에서 마우스로 로고를 직접 클릭해 자유롭게 드래그해보세요.
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mockupCanvas');
    const ctx = canvas.getContext('2d');

    let bgImg = new Image();
    let logoImg = null;

    let logoState = {
      x: 235,
      y: 190,
      scale: 1,
      rotate: 0,
      opacity: 1,
      blend: 'multiply'
    };

    let isDragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // GitHub 저장소의 mockup.png 자동 로드
    bgImg.src = 'mockup.png';
    bgImg.onload = () => draw();
    bgImg.onerror = () => {
      ctx.fillStyle = '#181a20';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ef4444';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('mockup.png 이미지를 불러올 수 없습니다.', canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '13px sans-serif';
      ctx.fillText('GitHub 저장소에 올려두신 이미지 이름이 mockup.png인지 확인해 주세요.', canvas.width / 2, canvas.height / 2 + 15);
    };

    function applyLogoImage(img) {
      logoImg = img;
      const targetSize = 70;
      logoState.scale = targetSize / Math.max(img.width, img.height);
      document.getElementById('scaleInput').value = 100;
      document.getElementById('valScale').innerText = '100%';
      draw();
    }

    // Ctrl + V (붙여넣기) 이벤트 지원
    window.addEventListener('paste', (e) => {
      if (document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'text') return;
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;

      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const file = items[i].getAsFile();
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => applyLogoImage(img);
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
          e.preventDefault();
          break;
        }
      }
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 바탕 바람막이 도안 그리기
      if (bgImg.complete && bgImg.naturalWidth !== 0) {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
      }

      // 2. 로고 그리기
      if (logoImg) {
        ctx.save();
        ctx.globalAlpha = logoState.opacity;
        ctx.globalCompositeOperation = logoState.blend;

        ctx.translate(logoState.x, logoState.y);
        ctx.rotate((logoState.rotate * Math.PI) / 180);

        const w = logoImg.width * logoState.scale;
        const h = logoImg.height * logoState.scale;

        ctx.drawImage(logoImg, -w / 2, -h / 2, w, h);
        ctx.restore();
      }

      // 3. 텍스트 문구 그리기
      const txt = document.getElementById('textInput').value;
      if (txt) {
        ctx.save();
        ctx.font = 'bold 20px sans-serif';
        ctx.fillStyle = document.getElementById('textColor').value;
        ctx.textAlign = 'center';
        ctx.fillText(txt, 735, 340);
        ctx.restore();
      }
    }

    function handleLogoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => applyLogoImage(img);
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updateLogo() {
      const scaleVal = document.getElementById('scaleInput').value;
      const rotateVal = document.getElementById('rotateInput').value;
      const opacityVal = document.getElementById('opacityInput').value;
      const blendVal = document.getElementById('blendInput').value;

      document.getElementById('valScale').innerText = scaleVal + '%';
      document.getElementById('valRotate').innerText = rotateVal + '°';
      document.getElementById('valOpacity').innerText = opacityVal + '%';

      if (logoImg) {
        const baseSize = 70;
        logoState.scale = (baseSize / Math.max(logoImg.width, logoImg.height)) * (scaleVal / 100);
      }
      logoState.rotate = parseFloat(rotateVal);
      logoState.opacity = opacityVal / 100;
      logoState.blend = blendVal;

      draw();
    }

    function setPreset(preset) {
      if (!logoImg) {
        alert('먼저 로고 이미지를 업로드하거나 Ctrl+V로 붙여넣어주세요.');
        return;
      }
      switch (preset) {
        case 'front-left':
          logoState.x = 235; logoState.y = 190; break;
        case 'front-right':
          logoState.x = 310; logoState.y = 190; break;
        case 'back-center':
          logoState.x = 735; logoState.y = 230; break;
        case 'back-sleeve':
          logoState.x = 945; logoState.y = 425; break;
      }
      draw();
    }

    // 마우스 드래그 조작
    canvas.addEventListener('mousedown', (e) => {
      if (!logoImg) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;

      const w = logoImg.width * logoState.scale;
      const h = logoImg.height * logoState.scale;

      if (Math.abs(mouseX - logoState.x) < w / 2 && Math.abs(mouseY - logoState.y) < h / 2) {
        isDragging = true;
        dragOffsetX = mouseX - logoState.x;
        dragOffsetY = mouseY - logoState.y;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      logoState.x = (e.clientX - rect.left) * scaleX - dragOffsetX;
      logoState.y = (e.clientY - rect.top) * scaleY - dragOffsetY;
      draw();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'windbreaker-mockup-result.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
